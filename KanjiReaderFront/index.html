<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/manabu.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KanjiReader</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .preloader {
      background-color: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .spinner {
      font-size: 100px;
      color: white;
      animation: spin 1s linear infinite;
      display: inline-block;
      transform-origin: center center;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: 'Yu Mincho', 'Meiryo', serif;
      margin: 0;
      padding: 0;
    ">
      <span style="
        font-size: 6.5rem; 
        font-weight: 300;
        color: rgba(255, 255, 255, 0.87);
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        animation: htmlPulse 1.8s infinite ease-in-out;
      ">読み込み中</span>


    </div>

    <style>
      @keyframes htmlPulse {

        0%,
        100% {
          opacity: 0.4;
          text-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        50% {
          opacity: 1;
          text-shadow: 0 0 35px rgba(0, 242, 255, 0.15);
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
